<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digiservice Nuovo Sito</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@600;700;800&display=swap">
</head>
<body>
  <!-- Sito: header, pagina corrente e footer sono generati da src/ -->
  <div class="stage" id="stage" data-v="d">
    <main class="view">
      <header class="site-header" id="hd"></header>
      <div id="pg"></div>
      <footer class="ft" id="ft"></footer>
    </main>
  </div>

  <!-- Barra di anteprima della bozza, fissata in basso (src/shell/preview-bar.js) -->
  <div class="bar"><div class="in">
    <b>Bozza grafica del nuovo sito · Variante A «Luce»</b>
    <div class="rt">
      <span class="urlp" id="urlp"></span>
      <a class="lk" href="#mappa">Mappa del sito</a>
      <div class="seg" role="group" aria-label="Dispositivo">
        <button type="button" data-dev="d" aria-pressed="true">Desktop</button>
        <button type="button" data-dev="t" aria-pressed="false">Tablet</button>
        <button type="button" data-dev="m" aria-pressed="false">Mobile</button>
      </div>
    </div>
  </div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
