<title>Digiservice Nuovo Sito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{--rosso:#E1171F;--rosso-h:#B30F18;--rosso-l:#FF4048;--rosso-t:#FDECEE;--bianco:#fff;--nebbia:#F4F5F7;--linea:#E3E6EB;--ink:#0B1220;--ant:#1C2733;--grigio:#556070;--sh:0 24px 60px -24px rgba(11,18,32,.22);--fd:'Montserrat','Segoe UI',system-ui,sans-serif;--fb:'Inter','Segoe UI',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,monospace;--barh:52px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bianco);color:var(--ink);font:400 17px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
ul{list-style:none}
:focus-visible{outline:3px solid var(--rosso);outline-offset:3px;border-radius:6px}
.in{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.r{color:var(--rosso)}
/* barra anteprima */
.bar{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid var(--linea);padding-top:env(safe-area-inset-top,0px)}
.bar .in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.bar b{font:600 11px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--grigio)}
.seg{display:flex;gap:4px;background:var(--nebbia);padding:4px;border-radius:999px}
.seg button{font:700 13px var(--fd);padding:8px 16px;border-radius:999px;border:0;background:transparent;color:var(--ant);cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--rosso);color:#fff}
.seg.dv button{padding:8px 12px;font:600 12px var(--fm)}
.seg.dv button[aria-pressed=true]{background:var(--ink)}
.stage{container:st/inline-size;margin:0 auto;transition:max-width .3s;background:#fff}
.stage[data-v=t]{max-width:820px;box-shadow:0 0 0 1px var(--linea),var(--sh)}
.stage[data-v=m]{max-width:390px;box-shadow:0 0 0 1px var(--linea),var(--sh)}
.view{overflow-x:clip;position:relative}
.view[hidden]{display:none}
canvas{display:block;width:100%;height:100%}
/* tipografia */
.h1{font:800 clamp(40px,7.4cqi,100px)/1.02 var(--fd);letter-spacing:-.035em;text-wrap:balance}
.h2{font:800 clamp(30px,4.4cqi,58px)/1.06 var(--fd);letter-spacing:-.03em;text-wrap:balance}
.h3{font:800 clamp(22px,2.4cqi,30px)/1.15 var(--fd);letter-spacing:-.02em}
.lead{font-size:clamp(17px,1.7cqi,21px);color:var(--grigio);max-width:34em}
.lab{font:600 12px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--grigio);display:flex;align-items:center;gap:10px}
.lab::before{content:"";width:22px;height:2px;background:var(--rosso)}
.dash{display:block;width:72px;height:4px;background:var(--rosso);margin:26px 0;border-radius:2px}
/* bottoni e componenti */
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;font:700 15px var(--fd);border:1.5px solid transparent;cursor:pointer;transition:transform .2s,background .2s,color .2s,box-shadow .2s;min-height:52px}
.btn-p{background:var(--rosso);color:#fff;box-shadow:0 14px 32px -12px rgba(225,23,31,.6)}
.btn-p:hover{background:var(--rosso-h);transform:translateY(-2px)}
.btn-o{border-color:var(--ink);color:var(--ink);background:#fff}
.btn-o:hover{background:var(--ink);color:#fff;transform:translateY(-2px)}
.btn-s{padding:11px 20px;font-size:14px;min-height:44px}
.arr{font:700 15px var(--fd);color:var(--rosso-h);display:inline-flex;gap:8px;align-items:center}
.arr::after{content:"→";transition:transform .2s}.arr:hover::after{transform:translateX(5px)}
.glass{background:rgba(255,255,255,.64);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.95);box-shadow:var(--sh),inset 0 1px 0 #fff;border-radius:20px}
.tag{display:inline-block;font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:var(--rosso-t);color:var(--rosso-h)}
.logo{display:flex;align-items:center;gap:10px;font:800 20px var(--fd);letter-spacing:-.03em}
.vis{position:relative;border-radius:28px;background:radial-gradient(120% 90% at 70% 30%,#fff 0,#FCF0F1 45%,#F4F5F7 100%);border:1px solid var(--linea);overflow:hidden;aspect-ratio:5/4}
.vis canvas{position:absolute;inset:0}
.chk li{display:flex;gap:12px;padding:7px 0;color:var(--ant)}
.chk li::before{content:"";flex:none;width:14px;height:2px;background:var(--rosso);margin-top:.85em}
.card{border:1px solid var(--linea);border-radius:26px;background:#fff;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 60px -28px rgba(225,23,31,.35);border-color:rgba(225,23,31,.4)}
.card .cv{aspect-ratio:4/3;position:relative;background:radial-gradient(100% 90% at 70% 30%,#fff,#FCF0F1 60%,#F4F5F7)}
.card .cv canvas{position:absolute;inset:0}
.card .tx{padding:22px 24px 26px;display:flex;flex-direction:column;gap:10px;flex:1}
.card p{color:var(--grigio);font-size:15px}
.logoph{height:84px;border:1.5px dashed #BCC2CC;border-radius:16px;display:grid;place-items:center;font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio);background:#fff}
.cert{width:112px;height:112px;border-radius:50%;border:1.5px solid var(--linea);display:grid;place-items:center;text-align:center;font:600 10px/1.3 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--grigio);background:radial-gradient(#fff,#F4F5F7);padding:10px}
.cert::before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--rosso);margin-bottom:-14px}
.float{position:absolute;padding:10px 16px;font:600 12px var(--fm);letter-spacing:.06em;display:flex;align-items:center;gap:8px;animation:fl 6s ease-in-out infinite}
.float i{width:8px;height:8px;border-radius:50%;background:var(--rosso);box-shadow:0 0 10px var(--rosso-l)}
@keyframes fl{50%{transform:translateY(-12px)}}
.rv{opacity:0;transform:translateY(16px);animation:rv .8s .1s ease-out forwards}
@keyframes rv{to{opacity:1;transform:none}}
.hdr{position:relative}
.burger{display:none;font:700 13px var(--fd);padding:10px 16px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;min-height:44px}
.nv{display:flex;gap:28px;font:600 14px var(--fd);align-items:center}
.nv a{padding:10px 0;position:relative}
.nv a::after{content:"";position:absolute;left:0;bottom:4px;height:2px;width:0;background:var(--rosso);transition:width .25s}.nv a:hover::after{width:100%}
.sec{padding:clamp(56px,8cqi,120px) 0}
.sec-h{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(28px,4cqi,56px)}
footer.ft{background:var(--nebbia);padding:56px 0 40px;border-top:1px solid var(--linea)}
.ft .g{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:32px}
.ft h4{font:600 12px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--grigio);margin-bottom:12px}
.ft li{padding:5px 0;font-size:15px;color:var(--ant)}
.ft small{display:block;margin-top:36px;color:var(--grigio);font-size:13px}
/* ---------- VARIANTE A ---------- */
.a-hd{position:sticky;top:var(--barh);z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--linea)}
.a-hd .in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.a-hero{position:relative;padding:clamp(40px,6cqi,90px) 0 clamp(36px,5cqi,70px)}
.a-hero::before{content:"";position:absolute;left:-5%;top:-10%;width:20%;height:125%;background:linear-gradient(100deg,rgba(225,23,31,.1),rgba(225,23,31,0));transform:skewX(-28deg)}
.a-hero::after{content:"";position:absolute;left:9%;top:-10%;width:10%;height:60%;background:linear-gradient(100deg,rgba(11,18,32,.05),rgba(11,18,32,0));transform:skewX(-28deg)}
.a-hero .in{position:relative;z-index:1;display:grid;grid-template-columns:1.02fr 1fr;align-items:center;gap:10px}
.a-hero .lead{margin-top:6px}
.a-hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.a-hv{position:relative;aspect-ratio:1/1;margin-right:-4%}
.a-hv canvas{position:absolute;inset:0}
.a-proof{display:flex;gap:clamp(18px,3cqi,44px);flex-wrap:wrap;margin-top:44px;padding-top:26px;border-top:1px solid var(--linea)}
.a-proof div{font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio)}
.a-proof b{display:block;font:800 28px var(--fd);letter-spacing:-.02em;color:var(--ink);text-transform:none}
.mq{border-block:1px solid var(--linea);overflow:hidden;background:#fff;padding:20px 0}
.mq div{display:flex;gap:44px;width:max-content;animation:mq 38s linear infinite;font:600 13px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--grigio)}
.mq span::after{content:"•";color:var(--rosso);margin-left:44px}
@keyframes mq{to{transform:translateX(-50%)}}
.a-row{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,5cqi,84px);align-items:center;padding:clamp(34px,5cqi,70px) 0;border-top:1px solid var(--linea)}
.a-row:first-of-type{border-top:0}
.a-row:nth-child(even) .vis{order:-1}
.a-row .tx{display:flex;flex-direction:column;gap:18px}
.num{font:800 clamp(56px,7cqi,92px)/1 var(--fd);color:transparent;-webkit-text-stroke:1.5px var(--rosso);letter-spacing:-.04em}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.steps>div{border-top:3px solid var(--rosso);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.steps span{font:600 12px var(--fm);color:var(--rosso-h);letter-spacing:.12em}
.steps p{color:var(--grigio);font-size:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.a-par{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,5cqi,70px);align-items:center}
.a-par .vis{aspect-ratio:1/1}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.certs{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
.a-cta{position:relative;border-radius:40px;background:linear-gradient(180deg,#fff,#F4F5F7);border:1px solid var(--linea);overflow:hidden;display:grid;grid-template-columns:1fr 1.1fr;align-items:center;min-height:440px}
.a-cta .tx{padding:clamp(28px,5cqi,70px);position:relative;z-index:1;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.a-cta .cvv{position:relative;height:100%;min-height:340px}
.a-cta .cvv canvas{position:absolute;inset:0}
.tri{font:800 clamp(34px,5.4cqi,70px)/1.02 var(--fd);letter-spacing:-.035em}
.tri span{display:block}.tri span:nth-child(2){color:#4A4F57}.tri span:nth-child(3){color:var(--rosso)}
.tri i{font-style:normal;color:var(--rosso)}
/* ---------- VARIANTE B ---------- */
.b-hdw{position:sticky;top:calc(var(--barh) + 12px);z-index:40;display:flex;justify-content:center;padding:0 16px;height:0;pointer-events:none}
.b-hd{pointer-events:auto;display:flex;align-items:center;gap:28px;padding:8px 10px 8px 22px;border-radius:999px;max-width:100%;position:relative}
.b-hd .nv{gap:22px}
.b-hero{position:relative;min-height:min(94vh,900px);display:flex;align-items:center;overflow:hidden;padding:130px 0 80px}
.b-hero .bg{position:absolute;inset:0}
.b-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff 22%,rgba(255,255,255,.85) 40%,rgba(255,255,255,0) 64%);pointer-events:none}
.b-hero .in{position:relative;z-index:2;width:100%}
.b-hero .h1{font-size:clamp(38px,5.6cqi,84px)}
.b-hero .tx{max-width:min(620px,52%);display:flex;flex-direction:column;gap:6px}
.b-hero .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
.chat{position:absolute;z-index:3;right:max(20px,5%);bottom:9%;width:min(380px,40%);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.chat .h{display:flex;align-items:center;gap:10px;font:600 11px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio)}
.chat .h i{width:9px;height:9px;border-radius:50%;background:var(--rosso);box-shadow:0 0 12px var(--rosso-l)}
.chat .h em{margin-left:auto;font-style:normal;color:var(--rosso-h)}
.chat .q{font:700 15px/1.4 var(--fd);min-height:2.8em}
.chat .q::after{content:"";display:inline-block;width:2px;height:1em;background:var(--rosso);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.chat ul{display:flex;flex-direction:column;gap:6px;min-height:84px}
.chat li{font-size:14px;color:var(--ant);display:flex;gap:10px;opacity:0;transform:translateY(6px);transition:.4s}
.chat li.on{opacity:1;transform:none}
.chat li::before{content:"";flex:none;width:12px;height:2px;background:var(--rosso);margin-top:.75em}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.tile{position:relative;border-radius:30px;border:1px solid var(--linea);background:radial-gradient(110% 90% at 75% 20%,#fff,#FCF0F1 55%,#F4F5F7);overflow:hidden;min-height:420px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;transition:box-shadow .3s,border-color .3s}
.tile:hover{box-shadow:0 30px 60px -28px rgba(225,23,31,.4);border-color:rgba(225,23,31,.4)}
.tile canvas{position:absolute;inset:0;z-index:0}
.tile>*:not(canvas){position:relative;z-index:1}
.tile::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(0deg,rgba(255,255,255,.96) 30%,rgba(255,255,255,0));z-index:0;pointer-events:none}
.tile p{color:var(--grigio);font-size:15px;max-width:30em}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s12{grid-column:span 12}
.code{font:500 12.5px/1.7 var(--fm);color:var(--ant);padding:14px 18px;border-radius:16px;align-self:flex-start;white-space:pre}
.code .k{color:var(--rosso-h)}.code .c{color:#7a8494}
.redtile{background:var(--rosso);color:#fff;border:0;min-height:0;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:34px 40px}
.redtile::after{display:none}
.redtile .btn{background:#fff;color:var(--rosso-h)}
.redtile .btn:hover{background:var(--ink);color:#fff}
.redtile h3{color:#fff;max-width:20em}
.bsteps li{display:grid;grid-template-columns:110px 1fr 1.3fr;gap:24px;align-items:center;padding:26px 16px;border-top:1px solid var(--linea);transition:background .25s}
.bsteps li:last-child{border-bottom:1px solid var(--linea)}
.bsteps li:hover{background:var(--rosso-t)}
.bsteps .num{font-size:56px}
.bsteps p{color:var(--grigio)}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px}
.rail .card{flex:0 0 min(380px,82%);scroll-snap-align:start}
.const{position:relative;border-radius:36px;border:1px solid var(--linea);background:radial-gradient(100% 100% at 50% 40%,#fff,#FCF0F1 60%,#F4F5F7);aspect-ratio:16/8;overflow:hidden}
.const canvas{position:absolute;inset:0}
.const .logoph{position:absolute;width:132px;height:62px;background:rgba(255,255,255,.8);backdrop-filter:blur(8px)}
.news li{display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:center;padding:24px 8px;border-top:1px solid var(--linea);transition:padding .25s,background .25s}
.news li:last-child{border-bottom:1px solid var(--linea)}
.news li:hover{padding-left:24px;background:var(--rosso-t)}
.news time{font:600 12px var(--fm);letter-spacing:.1em;color:var(--grigio);text-transform:uppercase}
.news h3{font:700 clamp(18px,2cqi,24px)/1.25 var(--fd);letter-spacing:-.01em}
.b-cta{position:relative;border-radius:44px;overflow:hidden;border:1px solid var(--linea);background:radial-gradient(100% 100% at 70% 40%,#fff,#FCF0F1 60%,#F4F5F7);min-height:520px;display:flex;align-items:center}
.b-cta canvas{position:absolute;inset:0}
.b-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.95) 20%,rgba(255,255,255,0) 60%);pointer-events:none}
.b-cta .tx{position:relative;z-index:2;padding:clamp(28px,5cqi,70px);display:flex;flex-direction:column;gap:22px;align-items:flex-start}
/* ---------- DESIGN SYSTEM ---------- */
.ds .sec{padding:clamp(40px,6cqi,80px) 0;border-top:1px solid var(--linea)}
.ds .sec:first-child{border-top:0}
.ds p{color:var(--grigio)}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pr{padding:24px;border:1px solid var(--linea);border-radius:22px;display:flex;flex-direction:column;gap:10px;background:#fff}
.pr b{font:800 20px var(--fd);letter-spacing:-.02em}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.sw div{border-radius:18px;overflow:hidden;border:1px solid var(--linea);background:#fff}
.sw i{display:block;height:92px}
.sw span{display:block;padding:12px 14px;font:500 12px/1.5 var(--fm);color:var(--ant)}
.sw b{display:block;font:700 14px var(--fd)}
.tp{display:grid;gap:0}
.tp div{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:baseline;padding:18px 0;border-top:1px solid var(--linea)}
.tp small{font:500 12px var(--fm);color:var(--grigio)}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vg .vis{aspect-ratio:4/3}
.vg figcaption{padding:12px 4px;font-size:14px;color:var(--grigio)}
.vg figcaption b{display:block;color:var(--ink);font:700 16px var(--fd)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.inp{font:500 16px var(--fb);padding:15px 18px;border-radius:14px;border:1.5px solid var(--linea);background:#fff;min-width:240px;color:var(--ink)}
.inp:focus{outline:3px solid rgba(225,23,31,.25);border-color:var(--rosso)}
.mt{width:100%;border-collapse:collapse;font-size:15px}
.mt td,.mt th{padding:14px 12px;border-top:1px solid var(--linea);text-align:left;vertical-align:top}
.mt th{font:600 12px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--grigio)}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sino>div{padding:22px;border-radius:20px;border:1px solid var(--linea)}
.sino .ok{background:#F4F9F5}.sino .no{background:var(--rosso-t)}
.sino li{padding:5px 0 5px 22px;position:relative;font-size:15px;color:var(--ant)}
.sino li::before{position:absolute;left:0;font-weight:800}
.sino .ok li::before{content:"✓";color:#1B7F3B}.sino .no li::before{content:"✕";color:var(--rosso-h)}
/* ---------- RESPONSIVE (container) ---------- */
@container st (max-width:980px){
 .nv,.nv-cta{display:none}.burger{display:inline-flex;align-items:center}
 .hdr.open .nv{display:flex;flex-direction:column;align-items:flex-start;gap:4px;position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--linea);border-radius:20px;padding:14px 22px;box-shadow:var(--sh)}
 .a-hd .hdr.open .nv{top:100%;left:-20px;right:-20px;border-radius:0}
 .a-hero .in,.a-row,.a-par,.a-cta{grid-template-columns:1fr}
 .a-hv{max-width:560px;margin:0 auto;width:100%}
 .a-row:nth-child(even) .vis{order:0}
 .steps,.grid3,.g4{grid-template-columns:repeat(2,1fr)}
 .b-hero{min-height:0;padding:120px 0 40px;display:block}
 .b-hero .bg{position:relative;height:380px;margin-top:-10px;order:2}
 .b-hero{display:flex;flex-direction:column}
 .b-hero::after{display:none}
 .b-hero .tx{max-width:none}
 .chat{position:relative;right:auto;bottom:auto;width:auto;margin:-60px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));order:3}
 .s7,.s5{grid-column:span 12}
 .bsteps li{grid-template-columns:70px 1fr}.bsteps li p{grid-column:2}
 .vg{grid-template-columns:repeat(2,1fr)}.sw{grid-template-columns:repeat(2,1fr)}
 .const{aspect-ratio:1/1}.const .logoph:nth-of-type(n+5){display:none}

function mount(cv){
 const f=reg[cv.dataset.s];if(!f)return;let o={};try{o=JSON.parse(cv.dataset.o||'{}')}catch(e){}
 const scene=f(o),ctx=cv.getContext('2d');let w=0,h=0,vis=false,raf=0,t=reduce?3:0,last=0;
 const draw=()=>{if(!w||!h)return;ctx.clearRect(0,0,w,h);scene(ctx,w,h,t)};
 const size=()=>{const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;if(!w||!h)return;cv.width=Math.round(w*d);cv.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw()};
 const loop=now=>{raf=0;if(!vis)return;t+=Math.min((now-last)/1000,.05);last=now;draw();raf=requestAnimationFrame(loop)};
 new ResizeObserver(size).observe(cv);
 new IntersectionObserver(es=>{vis=es[es.length-1].isIntersecting;if(vis&&!reduce&&!raf){last=performance.now();raf=requestAnimationFrame(loop)}},{rootMargin:'120px'}).observe(cv);
}
window.mountScenes=()=>document.querySelectorAll('canvas[data-s]').forEach(mount);
})();
